<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xxb 的小站</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="mask"></div>
    <div class="background-container">
        <div class="background">
            <!-- <img src="img/background.svg" alt="背景图"> -->
        </div>
        <img src="img/furry.svg" alt="背景图" class="background-author-image">
    </div>
    <div class="overlay">
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <span class="header-title">xxb</span>
                </div>
                <div class="header-right">
                    <input type="text" id="search-input" class="header-search" placeholder="搜索...">
                    <button id="theme-button" class="header-button">
                        <img src="img/moon.svg" alt="主题切换" class="theme-logo">
                    </button>
                    <button id="language-button" class="header-button">
                        <img src="img/language.svg" alt="语言" class="theme-logo">
                    </button>
                </div>
            </div>
        </header>
    </div>
    <div id="project-container" class="project-container"></div>
    <div class="tips-container">
        <div id="no-find-text">什么也没有 OwO...</div>
    </div>
</body>

</html>

<script src="js/projects.js"></script>
<script src="js/language.js"></script>
<script src="js/theme.js"></script>
<script src="js/home.js"></script>
